name: selcuk
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
#  schedule:
#    - cron: '*/5 * * * *'  

jobs:
  SelcukGuncelleme:
    runs-on: ubuntu-24.04 # ubuntu-latest yerine doğrudan kararlı sürüm kullanıldı
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4 # En son kararlı v4 sürümü
        
      - name: Python 3.11.8 Yükle
        uses: actions/setup-python@v5 # En son kararlı v5 sürümü
        with:
          python-version: 3.11.8
          
      - name: Gereksinimleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik httpx parsel requests cloudscraper beautifulsoup4
          
      - name: selcuk.py Çalıştır
        run: python selcuk.py

      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        run: |
          git diff --quiet . || echo "degisiklik=true" >> $GITHUB_OUTPUT
          
      - name: Değişiklikleri Commit Et
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🔄 Kanallar güncellendi" -m "📺 Selcuk domain kontrolü ve M3U güncellemeleri tamamlandı" -m "🕒 Otomatik işlem - $GITHUB_SHA"
          git push
